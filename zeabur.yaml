# Zeabur 部署配置
services:
  # 后端 API 服务
  - name: stock-backtest-api
    type: prebuilt
    template: python
    source:
      type: static
      path: backend
    env:
      PYTHON_VERSION: "3.11"
      PORT: "8080"
    commands:
      install: pip install -r requirements.txt
      start: python app.py
    healthCheck:
      path: /
      interval: 30s

  # 前端静态站点（可选，也可部署到 Vercel）
  - name: stock-backtest-frontend
    type: prebuilt
    template: static
    source:
      type: static
      path: frontend