edition: 1.0.0
name: stock-backtest-api
access: default

vars:
  region: cn-hangzhou

services:
  stock-backtest:
    component: fc
    props:
      region: ${vars.region}
      service:
        name: stock-backtest-service
        description: 股票回测系统 API
        internetAccess: true
      function:
        name: api
        description: Flask API 服务
        runtime: custom
        codeUri: ./
        handler: index.handler
        initializer: index.initializer
        memorySize: 512
        timeout: 60
        initializerTimeout: 30
        instanceConcurrency: 10
        environmentVariables:
          PYTHONPATH: /code
          TUSHARE_TOKEN: ${env(TUSHARE_TOKEN)}
      triggers:
        - name: httpTrigger
          type: http
          config:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD
              - OPTIONS
      customDomains:
        - domainName: auto
          protocol: HTTP
          routeConfigs:
            - path: /*
              serviceName: stock-backtest-service
              functionName: api